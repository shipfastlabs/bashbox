name: Formats

on: ["push", "pull_request"]
permissions: write-all
jobs:
  ci:
    runs-on: ubuntu-latest

    name: Formats P8.4 - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: dom, mbstring, zip
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: dependencies-php-8.4-os-ubuntu-latest-composer-${{ hashFiles('composer.json') }}
          restore-keys: dependencies-php-8.5-os-ubuntu-latest-composer-

      - name: Install Composer dependencies
        run: composer update --prefer-stable --no-interaction --prefer-dist

      - name: Coding Style Checks
        run: composer test:lint

      - name: Type Checks
        run: composer test:types

      - name: Type Coverage Checks
        run: composer test:type-coverage

      - name: Refactor Checks
        run: composer test:refactor
